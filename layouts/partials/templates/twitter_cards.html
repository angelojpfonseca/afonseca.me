{{- $cover := .Params.image | default .Params.cover.image }}
{{- if $cover }}
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="{{ $cover | absURL }}" />
{{- else }}
<meta name="twitter:card" content="summary" />
<meta name="twitter:image" content="{{ index site.Params.images 0 | absURL }}" />
{{- end }}
<meta name="twitter:title" content="{{ .Title }}" />
<meta name="twitter:description" content="{{ partial "page-description.html" . }}" />
